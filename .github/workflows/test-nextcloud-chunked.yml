name: Test - Nextcloud Chunked Upload

on:
  workflow_dispatch:

jobs:
  test:
    name: Test Chunked Upload (70MB dummy file)
    runs-on: ubuntu-22.04
    steps:
    - name: Create 70MB dummy file
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/dummy
        dd if=/dev/urandom of=${GITHUB_WORKSPACE}/dummy/MURP-test-70mb.bin bs=1M count=70
        ls -la ${GITHUB_WORKSPACE}/dummy

    - name: Upload to Nextcloud (chunked)
      run: |
        NC_USER="${{ secrets.NEXTCLOUD_USERNAME }}"
        NC_PASS="${{ secrets.NEXTCLOUD_PASSWORD }}"
        NC_URL="${{ secrets.NEXTCLOUD_URL }}"
        CHUNK_SIZE=8388608  # 8MB

        f="${GITHUB_WORKSPACE}/dummy/MURP-test-70mb.bin"
        fname=$(basename "$f")
        token="murp-test-$(date +%s)-$RANDOM"
        size=$(stat -c%s "$f")

        echo "Uploading $fname ($size bytes) via chunked upload..."

        curl --http1.1 -A "murp-builder" -s -o /dev/null -w "MKCOL: %{http_code}\n" \
          -u "$NC_USER:$NC_PASS" -X MKCOL \
          "$NC_URL/remote.php/dav/uploads/$NC_USER/$token"

        mkdir -p "/tmp/chunks_$token"
        split -b $CHUNK_SIZE -d -a 8 "$f" "/tmp/chunks_$token/"

        for part in $(ls "/tmp/chunks_$token/" | sort); do
          idx="$part"
          curl --http1.1 -A "murp-builder" \
            --retry 5 --retry-delay 10 --retry-all-errors \
            -u "$NC_USER:$NC_PASS" \
            -T "/tmp/chunks_$token/$part" \
            "$NC_URL/remote.php/dav/uploads/$NC_USER/$token/$idx"
        done

        curl --http1.1 -A "murp-builder" \
          -u "$NC_USER:$NC_PASS" -X MOVE \
          -H "Destination: $NC_URL/remote.php/dav/files/$NC_USER/MURP/$fname" \
          -H "OC-Total-Length: $size" \
          "$NC_URL/remote.php/dav/uploads/$NC_USER/$token/.file"

        rm -rf "/tmp/chunks_$token"
