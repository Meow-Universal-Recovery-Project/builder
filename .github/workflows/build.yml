name: MURP - Build

# Credits to:
# https://github.com/TeamWin
# https://gitlab.com/OrangeFox
# https://github.com/azwhikaru for Recovery Builder Template
# And all Contributors in every repositories I used

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'MURP Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'MURP Device Tree'
        required: true
        default: 'https://github.com/Meow-Universal-Recovery-Project/murp_device_samsung_a52q'
      DEVICE_TREE_BRANCH:
        description: 'MURP Device Tree Branch'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'Specify your Device Path'
        required: true
        default: 'device/samsung/a52q'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'a52q'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      USE_GITEA:
        description: 'Use Gitea'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'
      UPLOAD_TO_NEXTCLOUD:
        description: 'Upload to Nextcloud'
        required: true
        default: 'false'
        type: choice
        options:
        - 'true'
        - 'false'

jobs:
  build:
    name: Build MURP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
              
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
      
    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master
        cd scripts
        sudo bash setup/android_build_env.sh
      
    - name: Set-up Manifest
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git config --global url."https://${{ secrets.MANIFEST_TOKEN }}@github.com/".insteadOf "https://github.com/"
        mkdir -p ${GITHUB_WORKSPACE}/MURP
        cd ${GITHUB_WORKSPACE}/MURP
        repo init --depth=1 -u https://${{ secrets.MANIFEST_TOKEN }}@github.com/Meow-Universal-Recovery-Project/manifest.git -b murp-12.1
        repo sync -j$(nproc --all) -c --no-tags --no-clone-bundle

    - name: Use Gitea
      if: inputs.USE_GITEA == 'true'
      env:
        GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        GITEA_USER_AGENT: murp-builder
      run: |
        rm -rf "${GITHUB_WORKSPACE}/MURP/bootable/recovery"

        git config --global --unset-all http.extraheader || true
        git config --local --unset-all http.https://tea.meeow.tech/.extraheader || true

        git -c http.extraHeader="User-Agent: ${GITEA_USER_AGENT}" clone \
          "https://wojtekojtek:${GITEA_TOKEN}@tea.meeow.tech/wojtekojtek/android_bootable_recovery" \
          "${GITHUB_WORKSPACE}/MURP/bootable/recovery"
          
    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/MURP
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ inputs.DEVICE_NAME }}-${{ github.run_id }}
        restore-keys: ccache-${{ inputs.DEVICE_NAME }}-

    - name: Building MURP
      run: |
        cd ${GITHUB_WORKSPACE}/MURP
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export USE_CCACHE=1
        export CCACHE_DIR=~/.ccache
        ccache -M 10G
        set -e
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng && mka adbd -j$(nproc --all) ${{ inputs.BUILD_TARGET }}image

    - name: Set Release Properties
      run: |
        echo "BUILD_DATE=$(TZ=Asia/Manila date +%Y%m%d)" >> $GITHUB_ENV
        cd ${GITHUB_WORKSPACE}/MURP

        DEVICE_TREE_URL="${{ inputs.DEVICE_TREE }}"
        if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
        fi
        echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

    - name: Upload to Nextcloud
      if: inputs.UPLOAD_TO_NEXTCLOUD == 'true'
      run: |
        for f in ${GITHUB_WORKSPACE}/MURP/out/target/product/${{ inputs.DEVICE_NAME }}/MURP*.img \
                  ${GITHUB_WORKSPACE}/MURP/out/target/product/${{ inputs.DEVICE_NAME }}/MURP*.zip; do
          [ -f "$f" ] || continue
          curl -A "murp-builder" \
            -u "${{ secrets.NEXTCLOUD_USERNAME }}:${{ secrets.NEXTCLOUD_PASSWORD }}" \
            -T "$f" \
            "${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/files/${{ secrets.NEXTCLOUD_USERNAME }}/MURP/$(basename $f)"
        done

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          MURP/out/target/product/${{ inputs.DEVICE_NAME }}/MURP*.img
          MURP/out/target/product/${{ inputs.DEVICE_NAME }}/MURP*.zip
        name: MURP Recovery for ${{ inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: |
          ## MURP Recovery Build - Unofficial
          Build: murp-${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }}) during building.
