name: Test - Clone & Upload

on:
  workflow_dispatch:
    inputs:
      USE_GITEA:
        description: 'Test Gitea clone'
        required: true
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      UPLOAD_TO_NEXTCLOUD:
        description: 'Test Nextcloud upload'
        required: true
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'

jobs:
  test:
    name: Test Clone & Upload
    runs-on: ubuntu-22.04
    steps:
    - name: Use Gitea
      if: inputs.USE_GITEA == 'true'
      env:
        GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      run: |
        git -c http.userAgent="murp-builder" clone \
          "https://wojtekojtek:${GITEA_TOKEN}@tea.meeow.tech/wojtekojtek/android_bootable_recovery" \
          "${GITHUB_WORKSPACE}/test_clone"
        ls -la "${GITHUB_WORKSPACE}/test_clone"

    - name: Create dummy file
      if: inputs.UPLOAD_TO_NEXTCLOUD == 'true'
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/dummy
        echo "test upload $(date)" > ${GITHUB_WORKSPACE}/dummy/MURP-test.txt

    - name: Upload to Nextcloud
      if: inputs.UPLOAD_TO_NEXTCLOUD == 'true'
      run: |
        curl -A "murp-builder" \
          -u "${{ secrets.NEXTCLOUD_USERNAME }}:${{ secrets.NEXTCLOUD_PASSWORD }}" \
          -T "${GITHUB_WORKSPACE}/dummy/MURP-test.txt" \
          "${{ secrets.NEXTCLOUD_URL }}/remote.php/dav/files/${{ secrets.NEXTCLOUD_USERNAME }}/MURP/MURP-test.txt"
